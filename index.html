<title>刮刮樂選號器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 版面：單欄卡片式工具，上方輸入條碼、中間大字結果、下方 30 組候選號碼 */
:root {
  --bg: #f7f2ec;
  --surface: #ffffff;
  --fg: #2a1d1a;
  --muted: #7a6560;
  --line: #e7dcd3;
  --accent: #c8281e;
  --gold: #b9860b;
  --gold-soft: #fbefd0;
  --hit: #1f7a4a;
  --hit-soft: #e1f3e8;
  --font-display: "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1312; --surface: #261c1a; --fg: #f4e9e3; --muted: #b29c95; --line: #3d2e2b;
    --accent: #ff5a4a; --gold: #f0c04a; --gold-soft: #3a2e14; --hit: #5fd394; --hit-soft: #173826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1312; --surface: #261c1a; --fg: #f4e9e3; --muted: #b29c95; --line: #3d2e2b;
  --accent: #ff5a4a; --gold: #f0c04a; --gold-soft: #3a2e14; --hit: #5fd394; --hit-soft: #173826;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header h1 {
  font-family: var(--font-display); font-weight: 900; font-size: 28px; margin: 0;
  letter-spacing: .02em; text-wrap: balance;
}
header h1 span { color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
input[type="text"], input[type="number"] {
  width: 100%; font-family: var(--font-num); font-size: 18px; font-weight: 700;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg);
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#barcode { font-size: 26px; letter-spacing: .2em; text-align: center; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row3 input { text-align: center; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 13px; padding: 9px 4px; border: 0; background: var(--bg); color: var(--fg); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }

.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-row output { font-family: var(--font-num); font-weight: 700; min-width: 3ch; text-align: right; }

/* 結果區 */
.result { background: var(--gold-soft); border: 2px dashed var(--gold); border-radius: 14px; padding: 18px 16px; text-align: center; }
.result .lbl { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.picks { display: flex; justify-content: center; align-items: baseline; gap: 14px; margin: 6px 0; }
.picks b { font-family: var(--font-num); font-size: 56px; line-height: 1.1; color: var(--accent); }
.picks i { font-style: normal; color: var(--muted); font-size: 16px; }
.raw { font-family: var(--font-num); font-size: 14px; color: var(--muted); }
.steps {
  margin: 12px 0 0; padding: 10px 12px; background: var(--surface); border-radius: 10px; text-align: left;
  font-family: var(--font-num); font-size: 13px; line-height: 1.8; overflow-x: auto; white-space: pre;
}

/* 候選清單 */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.legend { font-size: 12px; color: var(--muted); }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--hit-soft); border: 1px solid var(--hit); vertical-align: -1px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.cell {
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center;
  font-variant-numeric: tabular-nums; background: var(--bg);
}
.cell .k { font-size: 11px; color: var(--muted); }
.cell .n { font-family: var(--font-num); font-weight: 700; font-size: 18px; }
.cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell.in { background: var(--hit-soft); border-color: var(--hit); }
.cell.in .n { color: var(--hit); }
.cell.out { opacity: .45; }
.copybar { display: flex; gap: 8px; }
.btn {
  font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; flex: 1;
}
.btn:active { transform: translateY(1px); }
#copyMsg { font-size: 12px; color: var(--hit); min-height: 1.2em; margin: 0; }

.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chips .hint { margin: 0; }
.ex {
  font: inherit; font-size: 13px; cursor: pointer; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
.ex[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 6px 18px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.page { display: flex; flex-direction: column; gap: 12px; }
.fold { gap: 0; padding: 0; }
.fold summary { padding: 14px 16px; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "＋"; color: var(--muted); }
.fold[open] summary::after { content: "－"; }
.fold[open] { gap: 12px; padding-bottom: 16px; }
.fold > :not(summary) { margin-inline: 16px; }
.result .slider-row { margin: 12px 0; }
.result .slider-row label { margin: 0; font-family: var(--font-num); font-weight: 700; color: var(--fg); }
.steps { margin: 0; }
.seg2 { grid-template-columns: repeat(2, 1fr); }
#rWin[aria-pressed="true"] { background: var(--hit); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); margin: 0; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.btn.solid { background: var(--accent); color: #fff; flex: none; width: 100%; }
.btn.solid:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: 13px; color: var(--hit); min-height: 1.2em; margin: -6px 0 0; }
.msg.err { color: var(--accent); }

.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.summary div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.summary .k { font-size: 12px; color: var(--muted); }
.summary .v { font-family: var(--font-num); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.summary .v.neg { color: var(--accent); }
.summary .v.pos { color: var(--hit); }

.tbl-wrap { overflow-x: auto; }
.stats { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.stats th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.stats td { padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stats td.num { font-family: var(--font-num); }
.stats .bar-col { width: 34%; }
.stats tr.ctrl td { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--gold); border-radius: 4px; }
.bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .5; }
.few { font-size: 11px; color: var(--muted); margin-left: 4px; }

.records { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.records li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border-radius: 10px; font-size: 13px; }
.records .r-main { flex: 1; min-width: 0; }
.records .r-top { font-family: var(--font-num); font-weight: 700; }
.records .r-sub { font-size: 12px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
.tag.win { background: var(--hit-soft); color: var(--hit); }
.del { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 6px; }
.del.armed { color: var(--accent); font-weight: 700; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

.note { font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>刮刮樂<span>選號器</span></h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tabPick" aria-selected="true">選號</button>
      <button type="button" role="tab" id="tabLog" aria-selected="false">紀錄</button>
    </nav>
  </header>

  <div id="pagePick" class="page">
    <section class="card">
      <label for="barcode">條碼前 6 碼</label>
      <input id="barcode" type="text" inputmode="numeric" maxlength="6" value="034391" autocomplete="off">
      <div class="chips">
        <span class="hint">範例：</span>
        <button type="button" class="ex" data-code="034391" data-rate="30" data-lo="" data-hi="">嗨刮123</button>
        <button type="button" class="ex" data-code="014129" data-rate="30" data-lo="60" data-hi="">錢進888</button>
      </div>
    </section>

    <section class="result" aria-live="polite">
      <div class="lbl" id="modeHint"></div>
      <div class="picks"><b id="p1">54</b><i>或</i><b id="p2">55</b></div>
      <div class="raw" id="raw">137 × 0.399 = 54.663</div>
      <div class="slider-row">
        <label for="k" id="kLabel">k</label>
        <input id="k" type="range" min="1" max="30" value="3">
        <output id="kOut" for="k">3</output>
      </div>
      <button class="btn solid" type="button" id="goLog">買了這張，去記錄</button>
    </section>

    <details class="card fold">
      <summary>計算過程</summary>
      <div class="steps" id="steps"></div>
    </details>

    <details class="card fold">
      <summary id="h-list">候選號碼</summary>
      <div class="row2">
        <div><label for="lo">檯面剩餘：最小</label><input id="lo" type="number" inputmode="numeric" min="0" placeholder="不限"></div>
        <div><label for="hi">最大</label><input id="hi" type="number" inputmode="numeric" min="0" placeholder="不限"></div>
      </div>
      <div class="grid" id="grid"></div>
      <button class="btn" type="button" id="copyAll">複製候選號碼</button>
      <p id="copyMsg"></p>
    </details>

    <details class="card fold">
      <summary>進階設定</summary>
      <div class="row3">
        <div><label for="a">A</label><input id="a" type="number" inputmode="numeric" min="0" max="99" value="3"></div>
        <div><label for="b">B</label><input id="b" type="number" inputmode="numeric" min="0" max="99" value="43"></div>
        <div><label for="c">C</label><input id="c" type="number" inputmode="numeric" min="0" max="99" value="91"></div>
      </div>
      <div class="row2">
        <div><label for="rate">中獎率 %</label><input id="rate" type="number" inputmode="decimal" min="1" max="100" step="0.1" value="30"></div>
        <div><label for="step">N 單位</label><input id="step" type="number" inputmode="decimal" min="0" step="0.001" value="0.033"></div>
      </div>
      <div>
        <label>公式</label>
        <div class="seg" role="group" aria-label="公式模式">
          <button type="button" id="mAuto" aria-pressed="true">自動</button>
          <button type="button" id="mA" aria-pressed="false">D ≥ 100</button>
          <button type="button" id="mB" aria-pressed="false">D &lt; 100</button>
        </div>
      </div>
    </details>
  </div>

  <div id="pageLog" class="page" hidden>
    <section class="card">
      <div class="list-head">
        <span class="hint" id="logNow"></span>
        <span class="legend" id="storeMode">載入中…</span>
      </div>
      <div class="row2">
        <div><label for="rPick">買的號碼</label><input id="rPick" type="number" inputmode="numeric" min="0"></div>
        <div><label for="rPrice">價格</label><input id="rPrice" type="number" inputmode="numeric" min="0" value="100"></div>
      </div>
      <div class="seg seg2" role="group" aria-label="結果">
        <button type="button" id="rWin" aria-pressed="false">中獎</button>
        <button type="button" id="rLose" aria-pressed="true">沒中</button>
      </div>
      <div id="prizeRow" hidden><label for="rPrize">獎金</label><input id="rPrize" type="number" inputmode="numeric" min="0" placeholder="例：100"></div>
      <label class="check"><input id="rCtrl" type="checkbox"> 隨便選的（對照組）</label>
      <button class="btn solid" type="button" id="rSave">記錄這張</button>
      <p id="saveMsg" class="msg"></p>
    </section>

    <section class="card">
      <div class="summary" id="summary"></div>
      <div class="tbl-wrap">
        <table class="stats">
          <thead><tr><th>選法</th><th>張數</th><th>中獎</th><th>中獎率</th><th class="bar-col"></th></tr></thead>
          <tbody id="statsBody"></tbody>
        </table>
      </div>
      <p class="hint" id="statsHint"></p>
    </section>

    <details class="card fold">
      <summary>最近紀錄</summary>
      <ul class="records" id="records"></ul>
    </details>
  </div>

  <p class="note">結果在印製時就已隨機決定，公式未經驗證，僅供娛樂參考。</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = ['barcode','a','b','c','rate','step','k','lo','hi'].reduce((o, id) => (o[id] = $(id), o), {});
  let mode = 'auto';
  let lastEff = null;
  let current = null;

  const round3 = x => Math.round(x * 1000) / 1000;
  const fmt = x => String(round3(x));
  const pad2 = n => String(n).padStart(2, '0');
  const num = (el, d = 0) => { const v = parseFloat(el.value); return isFinite(v) ? v : d; };

  // 依模式計算：A 模式 D×(rate + step×k)；B 模式 D×(1 + rate×k)
  function calc(D, rate, step, k, m) {
    const mult = m === 'A' ? rate + step * k : 1 + rate * k;
    return { mult, value: D * mult };
  }

  function syncFromBarcode() {
    const s = els.barcode.value.replace(/\D/g, '').slice(0, 6);
    if (els.barcode.value !== s) els.barcode.value = s;
    const parts = [s.slice(0, 2), s.slice(2, 4), s.slice(4, 6)];
    ['a','b','c'].forEach((id, i) => { if (parts[i].length) els[id].value = parseInt(parts[i], 10); });
  }
  function syncToBarcode() {
    els.barcode.value = ['a','b','c'].map(id => pad2(Math.max(0, Math.min(99, Math.floor(num(els[id])))))).join('');
  }

  function render() {
    const A = num(els.a), B = num(els.b), C = num(els.c);
    const D = A + B + C;
    const rate = num(els.rate, 30) / 100;
    const step = num(els.step, 0.033);
    const eff = mode === 'auto' ? (D >= 100 ? 'A' : 'B') : mode;

    // B 模式 k 只取 1～3 比較合理；A 模式 1～30
    const kMax = eff === 'A' ? 30 : 3;
    els.k.max = kMax;
    // 公式切換時重設 k 為貼文範例值（A 模式 k=3、B 模式 k=1）
    if (eff !== lastEff) { els.k.value = eff === 'A' ? 3 : 1; lastEff = eff; }
    if (+els.k.value > kMax) els.k.value = kMax;
    const k = +els.k.value;
    $('kOut').textContent = k;
    $('kLabel').textContent = 'k';
    $('modeHint').textContent = `A+B+C = ${D}・${eff === 'A' ? 'D ≥ 100' : 'D < 100'} 公式${mode === 'auto' ? '' : '（手動）'}`;

    const { mult, value } = calc(D, rate, step, k, eff);
    $('p1').textContent = Math.floor(value);
    $('p2').textContent = Math.ceil(value) === Math.floor(value) ? Math.floor(value) + 1 : Math.ceil(value);
    $('raw').textContent = `${D} × ${fmt(mult)} = ${fmt(value)}`;

    const N = eff === 'A' ? step * k : rate * k;
    const lines = [
      `A=${pad2(A)}，B=${pad2(B)}，C=${pad2(C)}`,
      `D = ${pad2(A)}+${pad2(B)}+${pad2(C)} = ${D}`,
      eff === 'A'
        ? `N = ${step} × ${k} = ${fmt(N)}`
        : `N = ${fmt(rate)} × ${k} = ${fmt(N)}`,
      eff === 'A'
        ? `${D} × (${fmt(rate)} + ${fmt(N)}) = ${D} × ${fmt(mult)}`
        : `${D} × (1 + ${fmt(N)}) = ${D} × ${fmt(mult)}`,
      `= ${fmt(value)} → 選 ${$('p1').textContent} 或 ${$('p2').textContent}`
    ];
    $('steps').textContent = lines.join('\n');

    // 提供給購買紀錄使用的目前選號狀態
    const pickChanged = !current || current.p1 !== +$('p1').textContent;
    current = { code: els.barcode.value, D, eff, k, p1: +$('p1').textContent, p2: +$('p2').textContent };
    if (pickChanged) $('rPick').value = current.p1;
    $('logNow').textContent = `${current.code}・k=${k}・建議 ${current.p1}／${current.p2}`;

    // 候選清單
    const lo = els.lo.value === '' ? -Infinity : num(els.lo);
    const hi = els.hi.value === '' ? Infinity : num(els.hi);
    const hasRange = els.lo.value !== '' || els.hi.value !== '';
    $('h-list').textContent = `候選號碼（${kMax} 組）`;
    const grid = $('grid');
    grid.innerHTML = '';
    for (let i = 1; i <= kMax; i++) {
      const v = calc(D, rate, step, i, eff).value;
      const n = Math.round(v);
      const cell = document.createElement('div');
      cell.className = 'cell' + (i === k ? ' sel' : '') + (hasRange ? (n >= lo && n <= hi ? ' in' : ' out') : '');
      cell.innerHTML = `<div class="k">k=${i}</div><div class="n">${n}</div><div class="k">${fmt(v)}</div>`;
      cell.addEventListener('click', () => { els.k.value = i; render(); });
      grid.appendChild(cell);
    }
    try { localStorage.setItem('scratch-picker', JSON.stringify({ rate: els.rate.value, step: els.step.value, lo: els.lo.value, hi: els.hi.value })); } catch (e) {}
  }

  els.barcode.addEventListener('input', () => { syncFromBarcode(); render(); });
  ['a','b','c'].forEach(id => els[id].addEventListener('input', () => { syncToBarcode(); render(); }));
  ['rate','step','k','lo','hi'].forEach(id => els[id].addEventListener('input', render));

  const segs = { auto: $('mAuto'), A: $('mA'), B: $('mB') };
  Object.entries(segs).forEach(([m, btn]) => btn.addEventListener('click', () => {
    mode = m;
    Object.values(segs).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  }));

  // 範例帶入：切回自動模式，k 由 render() 依公式重設（A 模式 3、B 模式 1）
  const exBtns = document.querySelectorAll('.ex');
  exBtns.forEach(btn => btn.addEventListener('click', () => {
    els.barcode.value = btn.dataset.code;
    els.rate.value = btn.dataset.rate;
    els.step.value = '0.033';
    els.lo.value = btn.dataset.lo;
    els.hi.value = btn.dataset.hi;
    mode = 'auto';
    Object.values(segs).forEach(b => b.setAttribute('aria-pressed', String(b === segs.auto)));
    exBtns.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    lastEff = null;
    syncFromBarcode();
    render();
  }));

  $('copyAll').addEventListener('click', async () => {
    const nums = [...document.querySelectorAll('#grid .cell:not(.out) .n')].map(e => e.textContent);
    const text = `條碼 ${els.barcode.value}：${[...new Set(nums)].join('、')}`;
    try { await navigator.clipboard.writeText(text); $('copyMsg').textContent = '已複製'; }
    catch (e) {
      $('copyMsg').textContent = text;
      const r = document.createRange(); r.selectNodeContents($('copyMsg'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  });

  try {
    const saved = JSON.parse(localStorage.getItem('scratch-picker') || 'null');
    if (saved) ['rate','step','lo','hi'].forEach(id => { if (saved[id] != null) els[id].value = saved[id]; });
  } catch (e) {}

  render();

  // ───── 購買紀錄 ─────
  // 優先存在 Claude 雲端（每個人自己的私人空間，跨裝置同步）；拿不到就退回本機瀏覽器
  const LS_KEY = 'scratch-records';
  let records = [];
  let store = null;
  let won = false;

  const setWon = v => {
    won = v;
    $('rWin').setAttribute('aria-pressed', String(v));
    $('rLose').setAttribute('aria-pressed', String(!v));
    $('prizeRow').hidden = !v;
  };
  $('rWin').addEventListener('click', () => setWon(true));
  $('rLose').addEventListener('click', () => setWon(false));

  function localStore() {
    const read = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } };
    const write = list => { try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {} };
    let onChange = () => {};
    return {
      label: '只存在這個瀏覽器',
      subscribe(fn) { onChange = fn; fn(read()); },
      async add(rec) { const list = read(); list.push({ ...rec, id: 'r' + Date.now() + Math.random().toString(36).slice(2, 6) }); write(list); onChange(list); },
      async remove(id) { const list = read().filter(r => r.id !== id); write(list); onChange(list); }
    };
  }

  function cloudStore(db, uid) {
    const col = db.collection('data/users/' + uid);
    return {
      label: '已同步到你的 Claude 帳號',
      subscribe(fn) {
        col.limit(1000).onSnapshot(
          snap => fn(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
          () => { $('storeMode').textContent = '連線中斷，請重新整理'; }
        );
      },
      add: rec => col.add(rec),
      remove: id => col.doc(id).delete()
    };
  }

  async function initStore() {
    let db = null, uid = null;
    try {
      if (window.claude && claude.use) {
        const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
        db = d; uid = u ? await u.id() : null;
      }
    } catch (e) {}
    store = db && uid ? cloudStore(db, uid) : localStore();
    $('storeMode').textContent = store.label;
    store.subscribe(list => { records = list.slice().sort((a, b) => (b.at || '').localeCompare(a.at || '')); renderLog(); });
  }

  const pct = (w, n) => n ? (w / n * 100) : 0;
  const money = v => (v < 0 ? '-' : '') + '$' + Math.abs(Math.round(v)).toLocaleString();
  const groupKey = r => r.ctrl ? 'ctrl' : `${r.mode}-${r.k}`;
  const groupName = key => key === 'ctrl' ? '隨便選（對照）' : `${key[0] === 'A' ? 'D≥100' : 'D<100'} k=${key.slice(2)}`;

  function renderLog() {
    const n = records.length;
    const wins = records.filter(r => r.won).length;
    const cost = records.reduce((s, r) => s + (+r.price || 0), 0);
    const prize = records.reduce((s, r) => s + (r.won ? +r.prize || 0 : 0), 0);
    const net = prize - cost;
    const rate = num(els.rate, 30);
    $('summary').innerHTML = `
      <div><div class="k">總張數</div><div class="v">${n}</div></div>
      <div><div class="k">整體中獎率</div><div class="v">${n ? pct(wins, n).toFixed(1) + '%' : '—'}</div></div>
      <div><div class="k">花費／獎金</div><div class="v">${money(cost)}／${money(prize)}</div></div>
      <div><div class="k">淨損益</div><div class="v ${net < 0 ? 'neg' : net > 0 ? 'pos' : ''}">${money(net)}</div></div>`;

    // 依選法分組：D≥100 k=1…、D<100 k=1…、對照組
    const groups = {};
    records.forEach(r => { const g = groups[groupKey(r)] ||= { n: 0, w: 0 }; g.n++; if (r.won) g.w++; });
    const keys = Object.keys(groups).sort((a, b) => {
      if (a === 'ctrl') return 1; if (b === 'ctrl') return -1;
      return a[0] === b[0] ? +a.slice(2) - +b.slice(2) : a.localeCompare(b);
    });
    const body = $('statsBody');
    body.innerHTML = keys.length ? '' : '<tr><td colspan="5" class="empty">還沒有紀錄，記下第一張後這裡會出現各 k 的中獎率。</td></tr>';
    keys.forEach(key => {
      const g = groups[key], p = pct(g.w, g.n);
      const tr = document.createElement('tr');
      if (key === 'ctrl') tr.className = 'ctrl';
      tr.innerHTML = `<td>${groupName(key)}</td><td class="num">${g.n}</td><td class="num">${g.w}</td>
        <td class="num">${p.toFixed(0)}%${g.n < 30 ? '<span class="few">少</span>' : ''}</td>
        <td><div class="bar"><span style="width:${Math.min(100, p)}%"></span><i style="left:${Math.min(100, rate)}%"></i></div></td>`;
      body.appendChild(tr);
    });
    $('statsHint').textContent = `直線＝標示中獎率 ${rate}%；「少」＝不到 30 張，參考價值低。`;

    const ul = $('records');
    ul.innerHTML = n ? '' : '<li class="empty">還沒有紀錄</li>';
    records.slice(0, 30).forEach(r => {
      const li = document.createElement('li');
      const d = new Date(r.at);
      const when = isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      li.innerHTML = `<div class="r-main"><div class="r-top"></div><div class="r-sub"></div></div><span class="tag"></span><button type="button" class="del">刪除</button>`;
      li.querySelector('.r-top').textContent = `${r.code}　買 ${r.pick} 號`;
      li.querySelector('.r-sub').textContent = `${groupName(groupKey(r))}・D=${r.D}・${when}`;
      const tag = li.querySelector('.tag');
      tag.textContent = r.won ? `中 ${money(+r.prize || 0)}` : '沒中';
      if (r.won) tag.classList.add('win');
      // 兩段式刪除：第一下變成「確定？」，3 秒內再按才刪
      const del = li.querySelector('.del');
      let timer = null;
      del.addEventListener('click', async () => {
        if (!del.classList.contains('armed')) {
          del.classList.add('armed'); del.textContent = '確定？';
          timer = setTimeout(() => { del.classList.remove('armed'); del.textContent = '刪除'; }, 3000);
          return;
        }
        clearTimeout(timer); del.disabled = true;
        try { await store.remove(r.id); } catch (e) { del.disabled = false; del.textContent = '刪除失敗'; }
      });
      ul.appendChild(li);
    });
  }

  $('rSave').addEventListener('click', async () => {
    const msg = $('saveMsg');
    msg.className = 'msg';
    if (!store) { msg.textContent = '紀錄功能還在載入，請稍等一下再按。'; msg.className = 'msg err'; return; }
    const pick = parseInt($('rPick').value, 10);
    if (!isFinite(pick)) { msg.textContent = '請填入實際買的號碼。'; msg.className = 'msg err'; return; }
    const rec = {
      at: new Date().toISOString(),
      code: current.code, D: current.D, mode: current.eff, k: current.k,
      suggested: [current.p1, current.p2], pick,
      ctrl: $('rCtrl').checked,
      price: num($('rPrice'), 100),
      won, prize: won ? num($('rPrize'), 0) : 0
    };
    $('rSave').disabled = true;
    try {
      await store.add(rec);
      msg.textContent = `已記錄：${rec.code} 買 ${pick} 號，${won ? '中獎' : '沒中'}`;
      setWon(false); $('rPrize').value = ''; $('rCtrl').checked = false;
    } catch (e) {
      msg.textContent = e && e.code === 'quota_exceeded' ? '紀錄已滿，請先刪除一些舊紀錄。' : '儲存失敗，請再按一次。';
      msg.className = 'msg err';
    } finally { $('rSave').disabled = false; }
  });

  // 分頁切換，記住上次停留的分頁
  const showTab = t => {
    $('pagePick').hidden = t !== 'pick'; $('pageLog').hidden = t !== 'log';
    $('tabPick').setAttribute('aria-selected', String(t === 'pick'));
    $('tabLog').setAttribute('aria-selected', String(t === 'log'));
    try { localStorage.setItem('scratch-tab', t); } catch (e) {}
  };
  $('tabPick').addEventListener('click', () => showTab('pick'));
  $('tabLog').addEventListener('click', () => showTab('log'));
  $('goLog').addEventListener('click', () => showTab('log'));
  try { if (localStorage.getItem('scratch-tab') === 'log') showTab('log'); } catch (e) {}

  els.rate.addEventListener('input', renderLog);
  renderLog();
  initStore();
})();
</script>
